<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Вход в аккаунт - VAPEBYVAPE.STORE">
    <meta name="theme-color" content="#0B0B12">
    <title>Вход - VAPEBYVAPE.STORE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="main-content">
        <div class="container auth-container">
            <div class="auth-card">
                <h1 class="auth-title">Вход</h1>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="you@example.com"
                            required
                        >
                        <span class="form-error" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Пароль</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="••••••••"
                            required
                        >
                        <span class="form-error" id="passwordError"></span>
                    </div>

                    <button type="submit" class="btn btn-gradient btn-full">Войти</button>
                </form>

                <p class="auth-footer">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </main>

    <div id="footer"></div>
    <div id="cart-notification"></div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
