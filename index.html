<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VAPEBYVAPE.STORE - Премиум интернет магазин жидкостей для вейпинга с доставкой по России">
    <meta name="keywords" content="вейп, вейпинг, жидкость, картридж, никотин, электронная сигарета">
    <meta property="og:title" content="VAPEBYVAPE.STORE - Премиум жидкости для вейпинга">
    <meta property="og:description" content="Безникотиновые и никотинсодержащие жидкости, картриджи и аксессуары">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#0B0B12">
    <title>VAPEBYVAPE.STORE - Премиум жидкости для вейпинга</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="main-content">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <div class="hero-text">
                    <h1 class="hero-title">VAPEBYVAPE</h1>
                    <p class="hero-subtitle">Премиум жидкости для вейпинга</p>
                    <a href="catalog.html" class="btn btn-gradient">Перейти в каталог</a>
                </div>
                <div class="hero-visual">
                    <div class="gradient-orb orb-1"></div>
                    <div class="gradient-orb orb-2"></div>
                </div>
            </div>
        </section>

        <!-- Popular Products Section -->
        <section class="section">
            <div class="container">
                <h2 class="section-title">Популярные товары</h2>
                <div id="popularProducts" class="products-grid">
                    <!-- Loaded via JavaScript -->
                </div>
            </div>
        </section>

        <!-- New Products Section -->
        <section class="section section-dark">
            <div class="container">
                <h2 class="section-title">Новинки</h2>
                <div id="newProducts" class="products-grid">
                    <!-- Loaded via JavaScript -->
                </div>
            </div>
        </section>

        <!-- Categories Section -->
        <section class="section">
            <div class="container">
                <h2 class="section-title">Категории</h2>
                <div id="categories" class="categories-grid">
                    <!-- Loaded via JavaScript -->
                </div>
            </div>
        </section>

        <!-- Reviews Section -->
        <section class="section section-dark">
            <div class="container">
                <h2 class="section-title">Отзывы клиентов</h2>
                <div id="reviews" class="reviews-grid">
                    <!-- Loaded via JavaScript -->
                </div>
            </div>
        </section>

        <!-- Contact Section -->
        <section class="section" id="contacts">
            <div class="container">
                <h2 class="section-title">Контакты</h2>
                <div class="contact-card">
                    <div class="contact-info">
                        <div class="contact-item">
                            <span class="contact-label">Телефон:</span>
                            <a href="tel:+79999999999">+7 (999) 999-99-99</a>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Email:</span>
                            <a href="mailto:info@vapebyvape.store">info@vapebyvape.store</a>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Telegram:</span>
                            <a href="https://t.me/vapebyvape" target="_blank">@vapebyvape</a>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Режим работы:</span>
                            <span>Пн-Пт: 10:00 - 20:00<br>Сб-Вс: 12:00 - 18:00</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <div id="cart-notification"></div>

    <script src="js/app.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
